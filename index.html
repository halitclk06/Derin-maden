<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derin Maden</title>
<style>
:root{--bg:#f1ece4;--panel:#fffaf2;--ink:#2a2018;--mute:#7a6b5c;--line:#d9cdbd;--ore:#b4640f;--gem:#0a8fa8;--gold:#a87400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17120f;--panel:#221b16;--ink:#f1e6d6;--mute:#a09080;--line:#3a2f27;--ore:#f0a23a;--gem:#5fd8f0;--gold:#ffcf4a;color-scheme:dark}}
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;max-width:560px;margin-inline:auto;padding:14px 14px 40px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:22px;margin:4px 0 10px;display:flex;justify-content:space-between;align-items:center}
#snd{background:none;border:1px solid var(--line);border-radius:8px;font-size:16px;padding:2px 8px;cursor:pointer;color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--ore);color:var(--ore);font-weight:bold}
.tab:disabled{opacity:.5;cursor:not-allowed}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-size:19px;font-family:Georgia,serif;color:var(--ore);white-space:nowrap}
.stat span{font-size:11px;color:var(--mute)}
.shaft{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px}
#cv{display:block;width:100%;height:230px;cursor:pointer;touch-action:manipulation}
.bar{display:flex;align-items:center;gap:14px;padding:10px 14px}
#rock{width:72px;height:72px;flex:none;border-radius:44% 56% 48% 52%/52% 44% 56% 48%;border:0;font-size:32px;cursor:pointer;touch-action:manipulation;transition:transform .08s,background .6s;box-shadow:inset -6px -7px 0 rgba(0,0,0,.2)}
#rock:active{transform:scale(.92) rotate(-3deg)}
#rock:focus-visible,.up:focus-visible,.tab:focus-visible,#reset:focus-visible,#snd:focus-visible{outline:3px solid var(--ore);outline-offset:2px}
.info{font-size:13px;color:var(--mute);line-height:1.55}
.info b{color:var(--ink)}
.pop{position:absolute;pointer-events:none;font-weight:bold;color:#ffd24a;text-shadow:0 1px 2px #000;animation:up .9s ease-out forwards;z-index:3}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.vein{position:absolute;z-index:4;border:2px solid #ffd24a;background:rgba(40,25,0,.88);color:#ffe27a;border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;animation:pl .7s ease-in-out infinite alternate}
@keyframes pl{to{transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}.vein{animation:none}}
h2{font-size:15px;margin:16px 0 8px}
.up{display:flex;width:100%;align-items:center;gap:10px;text-align:left;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.up .ic{font-size:26px}
.up .t{flex:1}
.up .t b{display:block;font-size:14px}
.up .t small{color:var(--mute);font-size:12px}
.up .c{font-size:13px;font-weight:bold;white-space:nowrap}
.up.ok{border-color:var(--ore)}
.up.ok .c{color:var(--ore)}
.up.dg.ok{border-color:var(--gem)}
.up.dg.ok .c{color:var(--gem)}
.up.gd.ok{border-color:var(--gold)}
.up.gd.ok .c{color:var(--gold)}
.up:disabled{opacity:.55;cursor:not-allowed}
#wb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:19;align-items:center;justify-content:center}
.wbtn{background:#ffcf4a;color:#222;border:0;border-radius:10px;padding:10px;font:inherit;font-weight:bold;cursor:pointer}
#wb1{background:none;border:1px solid #666;color:#bbb;border-radius:10px;padding:8px;font:inherit;cursor:pointer}
.bhud{display:none;position:absolute;top:8px;left:8px;z-index:4;background:rgba(0,0,0,.7);color:#ffe27a;border:1px solid #ffcf4a;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:bold;min-width:84px}
.bbar{height:3px;background:rgba(255,255,255,.25);margin-top:4px;border-radius:2px;overflow:hidden}
.bbar i{display:block;height:100%;background:#ffcf4a}
.offer{position:absolute;top:8px;right:8px;z-index:4;max-width:72%;text-align:left;border:2px solid #7fe0ff;background:rgba(5,25,35,.92);color:#bff3ff;border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;animation:pl .8s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.offer{animation:none}}
#ad{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;align-items:center;justify-content:center}
.adbox{background:#222;color:#eee;padding:20px;border-radius:14px;width:min(86vw,360px);text-align:center;font-size:14px}
.adtrack{height:8px;background:#444;border-radius:4px;margin:14px 0;overflow:hidden}
#adbar{height:100%;background:#ffcf4a;width:0}
#adx{background:none;border:1px solid #666;color:#bbb;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b2a33;color:#9ff0ff;border:1px solid #5fd8f0;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;max-width:90%;text-align:center}
#toast.show{opacity:1}
#reset{margin-top:18px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<h1><span>Derin Maden</span><button id="snd" aria-label="Sesi aç/kapat">🔊</button></h1>
<div class="tabs" id="tabs"></div>
<div class="stats">
  <div class="stat"><b id="ore">0</b><span id="oreL">Cevher</span></div>
  <div class="stat"><b id="ps">0</b><span>saniyede</span></div>
  <div class="stat"><b id="depth">0 m</b><span>derinlik</span></div>
</div>
<div class="shaft" id="shaft">
  <canvas id="cv"></canvas>
  <div class="bhud" id="bhud"></div>
  <div class="bar">
    <button id="rock" aria-label="Kaz">⛏️</button>
    <div class="info"><span id="layer"></span><br>Tık başına <b id="cp">1</b><br>🪙 <b id="gold">0</b><span id="gems"></span><br><span id="nxt"></span><br><span id="boost"></span></div>
  </div>
</div>
<h2>Kazma ve verim</h2>
<div id="manual"></div>
<h2>Otomatik üretim</h2>
<div id="auto"></div>
<div id="spSec"><h2 id="specH"></h2><div id="spec"></div></div>
<div id="tripSec"><h2>Yolculuk 🚀</h2><div id="trip"></div></div>
<div id="earthSec">
  <h2>Elmas geliştirmeleri 💎</h2>
  <div id="dia2"></div>
  <h2>Altın geliştirmeleri 🪙</h2>
  <div id="gold2"></div>
</div>
<button id="reset">Oyunu sıfırla</button>
<div id="ad"><div class="adbox"><div id="admsg"></div><div class="adtrack"><div id="adbar"></div></div><button id="adx">✕ Kapat (ödül yok)</button></div></div>
<div id="wb"><div class="adbox"><div id="wbtxt"></div><div style="margin-top:14px;display:flex;flex-direction:column;gap:8px"><button id="wb2" class="wbtn">🎬 2 ile çarp (video izle)</button><button id="wb1">Sadece al</button></div></div></div>
<div id="toast"></div>
<script src="ads-config.js"></script>
<script>

var PKN={earth:'Güçlü kazma',moon:'Ay kazması',mars:'Mars kazması',jup:'Basınç kazması',ven:'Asit kazması',mer:'Isıya dayanıklı kazma',sat:'Buz kazması',sun:'Plazma kazması'};

var UN={
 earth:[['👷','Çırak'],['🔩','Matkap'],['🧨','Dinamit ekibi'],['🚃','Maden vagonu'],['🚜','Ekskavatör'],['🏭','Yeraltı fabrikası']],
 moon:[['🦾','Robot kol'],['🛸','Kazı dronu'],['🔦','Lazer kesici'],['⚛️','Füzyon reaktörü'],['🛰️','Ay üssü'],['🛗','Ay asansörü']],
 mars:[['🚙','Mars gezgini'],['🌪️','Kum fırtınası matkabı'],['☄️','Plazma kazıcı'],['🏘️','Yeraltı kolonisi'],['🌐','Terraform istasyonu'],['🏭','Mars fabrikası']],
 jup:[['🌀','Gaz toplayıcı'],['⚡','Yıldırım rafinerisi'],['🔧','Basınç kazıcı'],['🧪','Hidrojen sondası'],['🛠️','Dev kazıcı platform'],['📡','Fırtına istasyonu']],

 mer:[['☀️','Güneş paneli matkap'],['🧲','Manyetik kazıcı'],['🧊','Kutup buzu erişimi'],['🤖','Isıya dayanıklı robot'],['🚂','Gece-gündüz treni'],['⚙️','Merkür fabrikası']],
 sat:[['❄️','Buz kesici'],['💍','Halka toplayıcı'],['🧊','Metan sondası'],['🛰️','Halka istasyonu'],['🌌','Çekim kazıcı'],['🏭','Satürn fabrikası']],
 sun:[['🔆','Güneş kolektörü'],['🔥','Plazma kazıcı'],['🧲','Manyetik halka'],['⚛️','Füzyon devi'],['🌟','Yıldız toplayıcı'],['🌞','Dyson küresi']]};
var PSb=[1,8,50,300,2000,15000],CSb=[50,500,4000,30000,250000,2000000];
function pk(w){return w=='earth'?'pick':'pk'}
function efid(w){return w=='earth'?'eff':'ef'}
var DEFS=[];
WS.forEach(function(w){var s=SCL[w],f=F[w],ids=w=='earth'?['ap','drill','dyn','cart','exc','fab']:['u0','u1','u2','u3','u4','u5'];
 DEFS.push({w:w,id:pk(w),g:'manual',ic:'🔨',n:PKN[w],d:'Her tık +'+fmt(CB[w])+' '+ON[w],base:15*s*f,mul:1.5});
 DEFS.push({w:w,id:efid(w),g:'manual',ic:'📈',n:EFN[w],d:'Tüm üretim +%25',base:500*s*f,mul:2});
 UN[w].forEach(function(u,i){DEFS.push({w:w,id:ids[i],g:'auto',ic:u[0],n:u[1],d:'+'+fmt(PSb[i]*s)+' / sn',base:CSb[i]*s*f,mul:1.15,ps:PSb[i]*s})})});
var GEMC=['#52d8ee','#c7fbff','#1d9db8'],AMC=['#a86bf0','#e2c8ff','#6a3fb8'],RUBY=['#e8454f','#ffb0b4','#a31d2a'],AMB=['#ffb347','#ffe0a0','#c46a10'],GRN=['#58d870','#c4ffd0','#2a9a46'],BLU=['#4a78f0','#b8ccff','#2a48b0'],PNK=['#f08ac0','#ffd6ec','#b84a88'];
var GEM={
 earth:{ic:'💎',n:'Elmas',c:0.02,pal:GEMC},moon:{ic:'🟣',n:'Mor zümrüt',c:0.0057,pal:AMC},mars:{ic:'🔴',n:'Kızıl yakut',c:0.0019,pal:RUBY},
 jup:{ic:'🟠',n:'Fırtına kehribarı',c:0.00085,pal:AMB},ven:{ic:'🟢',n:'Kükürt peridotu',c:0.0004,pal:GRN},mer:{ic:'🔵',n:'Merkür safiri',c:0.00019,pal:BLU},sat:{ic:'🩷',n:'Halka opali',c:0.00009,pal:PNK}};
var GATE={earth:[100,200,400,500,1000,1500,2000,2500,3000,3500],moon:[50,100,200,350,500,750,1000,1300,1700,2200],mars:[100,200,350,550,800,1100,1500,2000,2600,3300],
 jup:[150,300,500,800,1200,1700,2300,3000,3800,4700],ven:[200,400,700,1100,1600,2200,3000,4000,5200,6600],mer:[300,600,1000,1500,2200,3000,4000,5200,6600,8200],sat:[400,800,1400,2100,3000,4100,5400,7000,8800,11000]};
var TN=['Ay roketi','Mars mekiği','Jüpiter gemisi','Venüs sondası','Merkür kapsülü','Satürn gemisi','Güneş kalkanı aracı'],TI=['🚀','🛸','🪐','🛰️','☄️','🌌','☀️'],TO=[1e6,2e7,4e8,8e9,1.6e11,3.2e12,6.4e13];
var TRIP=TN.map(function(n,i){return {from:WS[i],to:WS[i+1],ic:TI[i],n:n,d:GEM[WS[i]].n+' toplayıp yolu aç',gem:10,ore:TO[i]}});
var ARR={moon:'🌙 Ay madenindesin! Burada mor zümrüt çıkar.',mars:'🔴 Mars madenindesin! Kızıl yakut ara.',jup:'🪐 Jüpiter\'e ulaştın! Fırtına kehribarı seni bekliyor.',ven:'🟡 Venüs\'tesin! Sıcak ve asitli, ama kükürt peridotu burada.',mer:'⚪ Merkür madeninde kazıyorsun! Safir ara.',sat:'💍 Satürn\'ün halkaları altındasın! Halka opali çıkabilir.',sun:'☀️ Güneş madenindesin! Son durak, şimdilik.'};
var SP=[
 {id:'det',ic:'🔍',n:'Dedektör',d:'Taş bulma şansı +%25',base:2,mul:1.7},
 {id:'str',ic:'⛏️',n:'Sondaj yoğunluğu',d:'Otomatik kazı vuruşu +%25',base:3,mul:1.8},
 {id:'pwr',ic:'💪',n:'Taş çekirdek',d:'Tüm üretim +%30',base:2,mul:1.6}];
var DD=[
 {id:'dpick',ic:'💎',n:'Elmas uçlu kazma',d:'Tık gücü +%50',base:1,mul:2},
 {id:'dauto',ic:'✨',n:'Elmas kaplı makineler',d:'Otomatik üretim +%40',base:1,mul:2}
];
var GD=[
 {id:'gfreq',ic:'🧭',n:'Altın dedektörü',d:'Altın şansı +%20',base:3,mul:1.6},
 {id:'gamt',ic:'🪙',n:'Zengin damar',d:'Her seferde +1 altın',base:5,mul:1.9},
 {id:'gmult',ic:'🟡',n:'Altın kaplama',d:'Dünya üretimi +%10',base:4,mul:1.7},
 {id:'dluck',ic:'🔍',n:'Elmas dedektörü',d:'Elmas şansı +%0.5',base:6,mul:1.6}
];
var LAYERS={earth:[[0,'Toprak katmanı','#8b7a66'],[10,'Kil katmanı','#a0674a'],[30,'Kömür damarı','#5a5a60'],[70,'Demir yatağı','#8a5b4a'],[150,'Taş ocağı','#7d7f86'],[300,'Derin kaya','#5d6a82']],
 moon:[[0,'Ay tozu','#9a9aa3'],[15,'Bazalt tabakası','#6f6f78'],[50,'Buzlu kayaç','#8fb4c4'],[120,'Helyum-3 damarı','#a08a5a'],[250,'Kristal çekirdek','#8a6bb0']],
 mars:[[0,'Kızıl toz','#a8553a'],[20,'Demirli kayaç','#8a3f2c'],[80,'Buzlu bazalt','#7a5a55'],[200,'Volkanik tüp','#6a342c'],[400,'Yakut damarı','#9a3040']],
 jup:[[0,'Gaz tabakası','#b38a5a'],[40,'Fırtına kuşağı','#9a6f45'],[150,'Sıvı hidrojen','#7a6a8a'],[400,'Metalik çekirdek','#6a7a90']],
 ven:[[0,'Kükürt tozu','#a08a3a'],[40,'Bazalt ovası','#7a5a3a'],[150,'Volkanik kabuk','#6a3a2a'],[400,'Lav tüpü','#8a3a20']],
 mer:[[0,'Yanık regolit','#8a7a6a'],[40,'Metalik kabuk','#7a7f88'],[150,'Demir çekirdek','#6a6070'],[400,'Safir damarı','#4a5a9a']],
 sat:[[0,'Buz tozu','#c8d4dc'],[40,'Halka kayacı','#a0a8b8'],[150,'Donmuş metan','#7a90a8'],[400,'Opal damarı','#c08aa8']],

function gateAt(w,i){var a=GATE[w];return i<a.length?a[i]:a[a.length-1]+1000*(i-a.length+1)}
function mkw(){return {ore:0,total:0,lv:{}}}
function fresh(){var o={d:{},g:{},gem:{},gi:{},gold:0,unl:{},world:'earth',mute:false,t:Date.now(),offerAt:Date.now()+90000,gemAt:0,oi:0,bUntil:0,bMult:1};WS.forEach(function(w){o[w]=mkw();if(GEM[w]){o.gem[w]=0;o.gi[w]=0}if(w!='earth')o.unl[w]=false});return o}
function load(){var d=fresh();try{var a=localStorage.getItem('derinmaden2'),b=localStorage.getItem('derinmaden');
 if(a){var p=JSON.parse(a);if(p&&p.earth&&p.moon){var old=p.gem===undefined,f=fresh();for(var k in f)if(p[k]===undefined)p[k]=f[k];
  ['gem','gi','unl'].forEach(function(k){for(var q in f[k])if(p[k][q]===undefined)p[k][q]=f[k][q]});
  if(old){p.gem.earth=p.dia||0;p.gi.earth=p.di||0;p.unl.moon=!!p.rocket}

 else if(b){var o=JSON.parse(b);if(o&&o.lv)d.earth={ore:o.ore||0,total:o.total||0,lv:o.lv}}}catch(e){}

var S=load(),away=(Date.now()-(S.t||Date.now()))/1000;S.t=Date.now();

function L(id,w){return S[w].lv[id]||0}
function dl(id){return S.d[id]||0}
function gl(id){return S.g[id]||0}
function cost(d){return Math.floor(d.base*Math.pow(d.mul,L(d.id,d.w)))}

function gcost(d){return Math.ceil(d.base*Math.pow(d.mul,gl(d.id)))}
function spc(d,w){return Math.ceil(d.base*Math.pow(d.mul,L(d.id,w)))}
